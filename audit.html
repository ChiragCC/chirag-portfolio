<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Marketing Audit | Chirag Chhatbar</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      padding: 40px;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      max-width: 700px;
      margin: auto;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      color: #1a2a6c;
    }

    p {
      color: #555;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }

    button {
      background: #1a2a6c;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background: #243b8f;
    }

    pre {
      background: #111;
      color: #00ff90;
      padding: 20px;
      margin-top: 25px;
      border-radius: 8px;
      white-space: pre-wrap;
      font-size: 14px;
      min-height: 120px;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>AI-Powered Marketing Audit</h1>
    <p>Analyze funnels, tracking, attribution & CRO like an enterprise Martech team.</p>

    <input
      id="url"
      type="text"
      placeholder="Enter website URL (e.g. https://example.com)"
    />

    <select id="channel">
      <option>Google Ads</option>
      <option>Facebook Ads</option>
      <option>SEO</option>
      <option>Email Marketing</option>
      <option>GA4 / Tracking</option>
    </select>

    <button onclick="runAudit()">Run Audit</button>

    <pre id="output">Awaiting input...</pre>
  </div>

  <div class="footer">
    Built by Chirag Chhatbar • AI + Marketing Analytics
  </div>

  <script>
    async function runAudit() {
      const url = document.getElementById("url").value.trim();
      const channel = document.getElementById("channel").value;
      const output = document.getElementById("output");

      if (!url) {
        output.textContent = "❌ Please enter a valid website URL.";
        return;
      }

      output.textContent = "🔍 Running AI audit... Please wait.";

      try {
        const response = await fetch("/.netlify/functions/audit", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ url, channel })
        });

        if (!response.ok) {
          throw new Error("Server error");
        }

        const data = await response.json();
        output.textContent = data.result;

      } catch (error) {
        console.error(error);
        output.textContent =
          "⚠️ Audit failed. Please check backend or console logs.";
      }
    }
  </script>

</body>
</html>
